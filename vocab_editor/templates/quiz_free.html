
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>自由テスト</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
        }

        .choice {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
            cursor: pointer;
        }

        .correct { background: #b9efc5; }
        .incorrect { background: #f6b9b9; }
    </style>
</head>
<body>
    {% include 'nav.html' %}
    <h1>自由テスト</h1>

    <div id="quiz">
        <p id="progress"></p>
        <h2 id="word"></h2>
        <div id="choices"></div>
        <p id="result"></p>
        <div id="networkArea" hidden>
            <button id="networkToggle" type="button">
                語源ネットワークを表示
            </button>

            <iframe
                id="networkFrame"
                title="語源ネットワーク"
                style="width: 100%; height: 650px; border: 1px solid #ddd; margin: 15px 0;"
                hidden>
            </iframe>
        </div>
        <button id="next" onclick="nextQuestion()" hidden>
            次の問題へ
        </button>
    </div>

    <a href="/">登録画面に戻る</a>
    <script src="{{ url_for('static', filename='quiz_network.js') }}"></script>
    <script>
        const questions = {{ questions | tojson }};
        let current = 0;
        let score = 0;
        let questionStartTime = 0;

        function showQuestion() {
            document.getElementById("networkArea").hidden = true;
            document.getElementById("networkFrame").hidden = true;
            document.getElementById("networkFrame").removeAttribute("src");
            if (current >= questions.length) {
                document.getElementById("quiz").innerHTML =
                    `<h2>テスト終了！</h2>
                     <p>正解数：${score} / ${questions.length}</p>`;
                return;
            }

            const question = questions[current];
            questionStartTime = performance.now();

            document.getElementById("progress").textContent =
                `${current + 1} / ${questions.length} 問`;

            document.getElementById("word").textContent = question.word;
            document.getElementById("result").textContent = "";
            document.getElementById("next").hidden = true;

            const choices = document.getElementById("choices");
            choices.innerHTML = "";

            question.choices.forEach(choice => {
                const button = document.createElement("button");
                button.className = "choice";
                button.textContent = choice;
                button.onclick = () => checkAnswer(choice, button);
                choices.appendChild(button);
            });
        }

        
        async function checkAnswer(choice, selectedButton) {
            const question = questions[current];

            // 二重クリックによる重複保存を防ぐ
            if (document.querySelector(".choice:disabled")) {
                return;
            }

            // 回答時間（秒）
            const responseTime = Number(
                ((performance.now() - questionStartTime) / 1000).toFixed(2)
            );

            const correct = choice === question.correct;

            document.querySelectorAll(".choice").forEach(button => {
                button.disabled = true;

                if (button.textContent === question.correct) {
                    button.classList.add("correct");
                }
            });

            if (!correct) {
                selectedButton.classList.add("incorrect");
            }

            document.getElementById("result").textContent =
                "回答を保存しています...";

            try {
                const response = await fetch("/quiz/log", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        quiz_type: "free",
                        question_index: current,
                        selected_answer: choice,
                        response_time: responseTime
                    })
                });

                if (!response.ok) {
                    throw new Error("ログ保存に失敗しました");
                }

                const result = await response.json();

                if (result.is_correct) {
                    score++;
                }

                document.getElementById("result").textContent =
                    result.is_correct
                        ? `正解！（${responseTime}秒）`
                        : `不正解。正解は「${question.correct}」（${responseTime}秒）`;
                setupNetwork(question, result.is_correct);
                document.getElementById("next").hidden = false;

            } catch (error) {
                document.getElementById("result").textContent =
                    "回答を保存できませんでした。もう一度お試しください。";

                // 保存失敗時に再回答できるようにする
                document.querySelectorAll(".choice").forEach(button => {
                    button.disabled = false;
                });
            }
        }


        function nextQuestion() {
            current++;
            showQuestion();
        }

        showQuestion();
    </script>
</body>
</html>
